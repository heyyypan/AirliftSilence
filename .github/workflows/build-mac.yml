name: Build macOS .app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            artifact: AirliftSilence-Intel
          - runner: macos-latest
            artifact: AirliftSilence-M芯片
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .app
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name AirliftSilence \
            --add-data "silent/StartDisclosureWithTone.m4a:silent" \
            --add-data "silent/StopDisclosure.caf:silent" \
            --osx-bundle-identifier "com.airliftsilence.app" \
            airlift_gui.py

      - name: Patch Info.plist
        run: |
          PLIST="dist/AirliftSilence.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" "$PLIST" || true

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - dist/AirliftSilence.app || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/AirliftSilence.app
